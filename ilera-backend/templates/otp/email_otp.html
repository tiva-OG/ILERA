<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILERA OTP Code</title>
    <style>

      :root {
        --bg-color: #ffffff;
        --text-color: #1a1a1a;
        --container-bg: #f9f9f9;
        --heading-color: #528C4A;
        --code-color: #2d2d2d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #f0f0f0;
          --container-bg: #1e1e1e;
          --heading-color: #88c87c;
          --code-color: #ffffff;
        }
      }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .logo-container {
            text-align: center;
            padding-top: 10px;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--container-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #528C4A;
            color: var(--heading-color);
            font-size: 2rem; /* ~32px */
            margin-bottom: 20px;
        }

        p {
            font-size: 1rem; /* ~16px */
            line-height: 1.6;
            margin: 10px 0;
            color: var(--text-color);
        }

        .code {
          font-size: 1.5rem; /* ~24px */
          font-weight: bold;
          color: var(--code-color);
          text-align: center;
          margin: 20px 0;
          letter-spacing: 1px;
      }

        .footer {
            text-align: center;
            font-size: 1rem;
            color: #777;
            margin-top: 30px;
        }

        .footer a {
            color: #007bff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
  </head>

  <body>
    <div class="logo-container">
      <img class="logo" src="https://i.imgur.com/dW3zAVZ.png" alt="ILERA Logo" />
    </div>
    <div class="container">
      <h1 >Welcome to ILERA!</h1>
      <p>Hello! Here's your ILERA OTP for verification:</p>

      <div class="code">{{ code }}</div>
      <p>This code will expire in 10 minutes. Please do not share it with anyone.</p>

      <!-- Footer -->
      <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;" />
      <p style="font-size: 14px; color: #777; text-align: center;">
        &copy; {{ year }} ILERA. All rights reserved.
      </p>
    </div>
  </body>

</html>
